[project]
name = "fixture-py-uv"
version = "0.1.0"
description = "Tiny uv/ruff/pytest fixture for the system-developer validator and smoke tests."
requires-python = ">=3.11" # broad floor so the fixture builds on common toolchains; verify against your toolchain
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# pytest lives in a dependency group (uv-native), not in project deps.
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/calc"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and pyupgrade (UP) so the planted
# violations in src/calc/legacy.py are reported.
select = ["E", "F", "UP"]
